{{- if .Values.postgresql.install }}
{{- $assistant := index .Values "release-assistant-helm-chart" -}}
{{- $llmEnabled := eq (include "release.llmServiceEnabled" . | trim) "true" -}}
{{/*
NOTE: This init.sql is rendered into a Secret and consumed by the bitnami
postgresql subchart via postgresql.initdb.scriptsSecret. The script is ONLY
executed on the chart's FIRST initialization — when the data directory is
empty. On an upgrade that adds the release assistant and/or LLM service to an
existing chart-based postgresql deployment (release-only -> release+assistant+llm),
the postgres data dir is already populated and this script WILL NOT RE-RUN.
As a result, the dai-assistant / dai-llm users and their databases will be
missing and the assistant / llm-service pods will fail with
"password authentication failed".

Workarounds for the chart-postgresql upgrade path:
  1. Switch to PostgresqlType: operator (CNPG), which supports dynamic DB
     creation via the operator — recommended.
  2. Manually apply this init.sql to the running postgres after the upgrade
     (idempotent: CREATE USER/DATABASE will fail-on-conflict but the
     subsequent ALTER DATABASE / GRANT statements will still be needed for
     any databases that DO exist).

The CNPG template (503-postgresql-cluster.yaml.tmpl in the kube-blueprints
repo) handles the equivalent creation in bootstrap.initdb.postInitSQL and is
not affected by this limitation.
*/}}
kind: Secret
apiVersion: v1
metadata:
  name: {{ include "postgresql.subchart" . }}-release
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- if or .Values.serviceAccount.annotations .Values.commonAnnotations }}
  annotations:
    {{- if .Values.commonAnnotations }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
    {{- end }}
    {{- if .Values.serviceAccount.annotations }}
    {{- include "common.tplvalues.render" (dict "value" .Values.serviceAccount.annotations "context" $) | nindent 4 }}
    {{- end }}
  {{- end }}
type: Opaque
stringData:
  init.sql: |
    CREATE USER "xlr" WITH ENCRYPTED PASSWORD 'xlr';
    CREATE DATABASE "xlr-db";
    ALTER DATABASE "xlr-db" OWNER TO "xlr";
    GRANT ALL PRIVILEGES ON DATABASE "xlr-db" TO "xlr";
    CREATE USER "xlr-report" WITH ENCRYPTED PASSWORD 'xlr-report';
    CREATE DATABASE "xlr-report-db";
    ALTER DATABASE "xlr-report-db" OWNER TO "xlr-report";
    GRANT ALL PRIVILEGES ON DATABASE "xlr-report-db" TO "xlr-report";
    {{- if $assistant.install }}
    CREATE USER "{{ include "release.assistantUsername" . }}" WITH ENCRYPTED PASSWORD '{{ include "release.assistantPassword" . }}';
    CREATE DATABASE "{{ include "release.assistantDbName" . }}";
    ALTER DATABASE "{{ include "release.assistantDbName" . }}" OWNER TO "{{ include "release.assistantUsername" . }}";
    GRANT ALL PRIVILEGES ON DATABASE "{{ include "release.assistantDbName" . }}" TO "{{ include "release.assistantUsername" . }}";
    {{- end }}
    {{- if $llmEnabled }}
    CREATE USER "{{ include "release.llmServiceUsername" . }}" WITH ENCRYPTED PASSWORD '{{ include "release.llmServicePassword" . }}';
    CREATE DATABASE "{{ include "release.llmServiceDbName" . }}";
    ALTER DATABASE "{{ include "release.llmServiceDbName" . }}" OWNER TO "{{ include "release.llmServiceUsername" . }}";
    GRANT ALL PRIVILEGES ON DATABASE "{{ include "release.llmServiceDbName" . }}" TO "{{ include "release.llmServiceUsername" . }}";
    {{- end }}
{{- end }}
