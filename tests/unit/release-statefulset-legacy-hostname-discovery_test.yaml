suite: Test Release Legacy Hostname Discovery
templates:
  - configuration.yaml
  - secrets.yaml
  - release-statefulset.yaml
tests:
  - it: should not inject XL_NODE_NAME by default
    template: release-statefulset.yaml
    values:
      - ../values/basic.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: XL_NODE_NAME

  - it: should inject POD_NAMESPACE and XL_NODE_NAME for xlr-legacy when enabled
    template: release-statefulset.yaml
    values:
      - ../values/basic.yaml
      - ../values/cluster-legacy-hostname-discovery.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: XL_NODE_NAME
            value: "$(POD_NAME).saas-digitalai-release-headless.$(POD_NAMESPACE).svc.cluster.local"
